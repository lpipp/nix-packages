name: Nix packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate all packages and kernel configurations
        run: nix flake check --no-update-lock-file --no-build
      - name: CLI, protocol, permissions and independent module configurations
        run: >-
          nix build --no-link --print-build-logs
          .#checks.x86_64-linux.cli
          .#checks.x86_64-linux.performance-cli
          .#checks.x86_64-linux.protocol
          .#checks.x86_64-linux.performance-protocol
          .#checks.x86_64-linux.permissions
          .#checks.x86_64-linux.kernel-guard
          .#checks.x86_64-linux.module

  kernels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel: ["6_6", "6_12", "6_18", "7_2"]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Driver, vermagic and merged module selection
        run: >-
          nix build --no-link --print-build-logs
          .#checks.x86_64-linux.driver-${{ matrix.kernel }}
          .#checks.x86_64-linux.module-selection-${{ matrix.kernel }}

  ubuntu-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lpipp/hunter-light
          ref: 9711bfe9d1033fb0e1ddb4fe95cd0fa245fcf96c
      - name: Upstream tests including Ubuntu installer rollback
        run: make test

  performance-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lpipp/hunter-linux
          ref: ad1559e89d700aa7c6becc37b79160ac418a1ccc
      - name: Read-only performance protocol and concurrency tests
        run: make test
